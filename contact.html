<html lang="en">
<head>
  <meta charset="utf-8" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Mayank</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="education.html">Education</a></li>
          <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="py-5">
    <div class="container">
      <h2>Contact</h2>

      <div class="row">
        <div class="col-md-6">
          <div class="card p-3 mb-3">
            <h5>Get in touch</h5>
            <p class="small text-muted mb-1">Email</p>
            <p><a href="mailto:mayank198010@gmail.com">mayank198010@gmail.com</a></p>
            <p class="small text-muted mb-1">Phone</p>
            <p>9968198010</p>
            <p class="small text-muted mb-1">LinkedIn</p>
            <p><a href="https://www.linkedin.com/in/mayank-kumar-83a489379" target="_blank" rel="noopener">linkedin.com/in/mayank-kumar-83a489379</a></p>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card p-3 mb-3">
            <h5>Quick message</h5>
            <form id="contactForm">
              <div class="mb-3">
                <label class="form-label">Your name</label>
                <input type="text" class="form-control" id="name" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Your email</label>
                <input type="email" class="form-control" id="email" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Message</label>
                <textarea class="form-control" id="message" rows="4" required></textarea>
              </div>
              <button class="btn btn-primary" type="submit">Send</button>
              <div id="formAlert" class="mt-3" style="display:none"></div>
            </form>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="py-4 bg-light mt-5">
    <div class="container text-center small">© <span id="year5"></span> Mayank</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('year5').innerText = new Date().getFullYear();

    // Simple form handler (no backend) — shows a thank you message
    const form = document.getElementById('contactForm');
    form.addEventListener('submit', function(e){
      e.preventDefault();
      const alertBox = document.getElementById('formAlert');
      alertBox.style.display = 'block';
      alertBox.className = 'alert alert-success';
      alertBox.innerText = 'Thanks! Your message was noted (this is a demo form).';
      form.reset();
    });
  </script>
</body>
</html>
